name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK предустановлен на раннере, отдельный setup не нужен
      # (android-actions/setup-android@v3 падает на пакете 'tools',
      #  удалённом из репозитория SDK)

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Publish build log to summary
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            tail -n 200 build.log >> $GITHUB_STEP_SUMMARY
          else
            echo 'Сборка упала до запуска Gradle — build.log не создан.' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freshmark-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
